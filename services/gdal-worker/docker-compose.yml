services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: eco_geotech_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecogeotech
      POSTGRES_USER: geotech
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD:-geotech_secure_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./postgis_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotech -d ecogeotech"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: eco_geotech_s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-eco_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-eco_minio_secret_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  gdal-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eco_geotech_worker
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      POSTGIS_DSN: postgresql://geotech:${POSTGIS_PASSWORD:-geotech_secure_pass}@postgis:5432/ecogeotech
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-eco_minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-eco_minio_secret_2026}
      S3_BUCKET: eco-geotech-artifacts
      GEOSPATIAL_WORKER_TOKEN: ${GEOSPATIAL_WORKER_TOKEN:-eco_worker_shared_secret}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-150}
      PROCESS_TIMEOUT_SEC: ${PROCESS_TIMEOUT_SEC:-120}
      ARTIFACT_TTL_SECONDS: ${ARTIFACT_TTL_SECONDS:-3600}
    ports:
      - "8081:8081"
    volumes:
      - worker_artifacts:/tmp/eco_artifacts
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8081/health\", timeout=3)'"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgis_data:
  minio_data:
  worker_artifacts:
